<html>
<head>
<script>
        function fact()
         { 
          var a=parseInt(window.prompt("enter number"));
          let fact=1;
      for (let i = 1; i <= a; i++) {
        fact = fact * i;
      }
      document.write(fact);
      }
</script>
</head>
<body> 
     <button onclick="fact()">Factorial</button>
</body>
</html>
